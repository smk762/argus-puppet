# argus-iris GPU tenant manifest for argus-puppet.
# Validated by argus-cortex's TenantManifest (gpu-tenant-schema.json, tenant_version 1.0);
# tests/test_gpu_tenant.py fails if it stops validating.
#
# Read when ARGUS_GPU_COORDINATOR=broker and ARGUS_GPU_TENANT_MANIFEST names this file (/app/gpu-tenant.yaml in
# the image). Tokens never go here: ARGUS_GPU_BROKER_TOKEN lives in the host's .env.
#
# One kind: the person detector and the pose model run in puppet's own process, in one lease. model_mb is the two
# default ONNX files (YOLOX-m 101 MB + DWPose-l 134 MB) as loaded; vram_mb adds ONNX Runtime's CUDA arena for a
# batch of crops. Folder scans take batch priority; POST /pose takes interactive. Set metrics (/stats, /compare)
# run on the CPU and take no lease. Not preemptible: a lease covers one batch.
#
# No residents yet: puppet has no /admin/unload route, so the broker cannot free its models.
tenant_version: "1.0"
tenant: argus-puppet
description: Whole-body pose (YOLOX person detector + DWPose 133 keypoints) on ONNX Runtime CUDA.
repo: smk762/argus-puppet

kinds:
  - kind: pose
    vram_mb: 1600
    model_mb: 240
    priority: batch
    preemptible: false
    description: YOLOX person detector and DWPose whole-body model, loaded together for a batch of images.
