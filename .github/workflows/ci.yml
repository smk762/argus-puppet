name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: smk762/argus-ci/.github/workflows/python-ci.yml@v1
    with:
      # python_min and the next minor, as in release.yml (tests/test_workflows.py checks
      # every version here satisfies requires-python; argus-ci's default is 3.11 + 3.12).
      python-versions: '["3.11", "3.12"]'
      ruff-version: "0.15.16"
      test-extras: "dev,server,cli,cpu"
      post-test: "uv run --no-sync argus-puppet schema --check"

  suite-rules:
    # argus-ci suite rules: lint rules that each eliminate a finding class. New violations fail;
    # existing ones are in .suite-rules-baseline.json, which may only shrink.
    uses: smk762/argus-ci/.github/workflows/suite-rules.yml@v1
