[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "argus-puppet"
dynamic = ["version"]
description = "Body pose for the Argus suite: whole-body keypoints, pose embeddings, diversity and coverage metrics, and ControlNet pose conditioning (:8220)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "smk762" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    # One cortex minor at a time, the suite's convention: argus-cortex is pre-1.0, where a minor bump carries no
    # compatibility guarantee. Bump every pin below together, on each cortex minor, after the suite passes on it.
    "argus-cortex>=0.13,<0.14",
    "numpy>=1.26",
    "pillow>=10.0",
    "pydantic>=2.6",
    "structlog>=24.0",
]

[project.optional-dependencies]
# ONNX Runtime for the estimators: pick one of cpu / gpu (they install the same `onnxruntime` module).
cpu = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18", "argus-cortex[gpu,remote,yaml]>=0.13,<0.14"]
# server pulls in cli: the service runs as `argus-puppet serve`, and its model volume is filled with
# `argus-puppet models fetch`, so a server install (the image's `[server,<cpu|gpu>]`) needs the CLI too.
server = [
    "argus-puppet[cli]",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.7",
    "argus-cortex[server,remote,yaml]>=0.13,<0.14",
]
# argus-cortex[remote] brings httpx, which `argus-puppet models fetch` downloads through (argus_cortex.net).
cli = ["typer>=0.12", "rich>=13.0", "argus-cortex[remote]>=0.13,<0.14"]
# httpx2 backs starlette's TestClient: starlette >=1.3 deprecated the httpx path
# and raises when neither client is installed, so testing the server needs it.
# dev pulls in the server, cli and cpu extras itself, so `.[dev]` alone runs every test.
dev = [
    "argus-puppet[server,cli,cpu]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.16",
    "httpx2>=2.7",
    "pyyaml>=6.0",
    "argus-cortex[yaml]>=0.13,<0.14",
]

[project.scripts]
argus-puppet = "argus_puppet.cli:app"

[project.urls]
Repository = "https://github.com/smk762/argus-puppet"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/argus_puppet/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/argus_puppet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["src/argus_puppet/_version.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]
